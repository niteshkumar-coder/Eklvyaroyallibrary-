
<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <link rel="icon" type="image/png" href="https://i.ibb.co/WvkzJYQG/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    window.tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            cinzel: ['Cinzel', 'serif'],
            playfair: ['Playfair Display', 'serif'],
            lora: ['Lora', 'serif'],
            montserrat: ['Montserrat', 'sans-serif'],
          },
          colors: {
            royalBlue: '#002366',
            metallicGold: '#D4AF37',
            deepMaroon: '#800000',
            premiumCream: '#F5F5DC',
          }
        }
      }
    }
  </script>
  <style>
    body {
      scroll-behavior: smooth;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #F5F5DC; }
    ::-webkit-scrollbar-thumb { background: #002366; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }

    /* Animations */
    @keyframes subtle-zoom { 
      from { transform: scale(1.0); } 
      to { transform: scale(1.1); } 
    }
    @keyframes fadeIn { 
      from { opacity: 0; transform: translateY(10px); } 
      to { opacity: 1; transform: translateY(0); } 
    }
    @keyframes scanLine { 
      0% { transform: translateY(-100%); } 
      100% { transform: translateY(500%); } 
    }
    
    .animate-subtle-zoom { animation: subtle-zoom 20s infinite alternate; }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    .animate-scan-line { animation: scanLine 4s linear infinite; }
    .animate-scan-line-delayed { animation: scanLine 4s linear infinite 2s; }

    /* Typography Utilities */
    .prose h1, .prose h2, .prose h3 { font-family: 'Cinzel', serif; }
  </style>
